<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TITAN — The Opening v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#020307;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;color:#e9edf4;-webkit-font-smoothing:antialiased;cursor:default}
canvas{position:fixed;inset:0}
.room{position:fixed;inset:0;opacity:0;animation:roomIn 2.4s ease forwards;pointer-events:none}
@keyframes roomIn{to{opacity:1}}
.room>*{pointer-events:auto}
.vg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(130% 95% at 50% 42%,transparent 42%,rgba(0,0,0,.6) 100%)}
.glow{position:fixed;width:340px;height:340px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(110,150,255,.05),transparent 65%);transform:translate(-50%,-50%);transition:opacity .3s}

.brand{position:fixed;top:22px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.55em;color:#4a5674;text-transform:uppercase}
.hud{position:fixed;top:20px;right:24px;display:flex;gap:10px;font-size:10px;letter-spacing:.14em;color:#5a6788;text-transform:uppercase}
.hud div{border:1px solid rgba(90,110,160,.18);background:rgba(10,14,24,.4);backdrop-filter:blur(6px);padding:6px 12px;border-radius:8px}
.hud b{color:#9fe8c9;font-weight:500}

.greet{position:fixed;left:50%;top:57.5%;transform:translateX(-50%);width:min(600px,86vw);text-align:center}
.who{font-size:11px;letter-spacing:.4em;color:#5d7396;text-transform:uppercase;opacity:0;animation:fUp 1.2s ease 2s forwards}
#speech{margin-top:14px;font-size:17.5px;font-weight:300;line-height:1.7;color:#dbe2ec;min-height:96px}
#speech b{font-weight:600;color:#fff}
.caret{display:inline-block;width:1px;height:1.05em;background:#7fa8ff;vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.figures{display:flex;gap:38px;justify-content:center;margin-top:20px;opacity:0}
.figures.show{animation:fUp 1.1s ease forwards}
.fig small{display:block;font-size:9.5px;letter-spacing:.24em;color:#5d7396;text-transform:uppercase;margin-bottom:6px}
.fig b{font-size:30px;font-weight:600;color:#fff;letter-spacing:.01em}
.fig .gold{color:#d8b26a}
.handled{margin-top:18px;font-size:12.5px;color:#6b7890;opacity:0}
.handled.show{animation:fUp 1s ease forwards}
@keyframes fUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.rail{position:fixed;left:0;top:0;bottom:0;width:190px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding-left:24px;transform:translateX(-26px);opacity:0;transition:.45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
body.rail-on .rail{opacity:1;transform:none;pointer-events:auto}
.dept-l{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:10px;color:#93a5c0;font-size:13px;cursor:pointer;border:1px solid transparent;transition:.22s}
.dept-l:hover{color:#fff;background:rgba(120,160,255,.06);border-color:rgba(120,160,255,.2);text-shadow:0 0 16px rgba(140,180,255,.7)}

.tick{position:fixed;right:24px;top:96px;width:236px;display:flex;flex-direction:column;gap:8px}
.job{border:1px solid rgba(100,125,180,.16);background:rgba(9,13,22,.55);backdrop-filter:blur(8px);border-radius:11px;padding:10px 13px;font-size:11.5px;color:#9fb0ca;opacity:0;transform:translateX(12px);transition:.5s}
.job.on{opacity:1;transform:none}
.job small{display:block;font-size:9px;letter-spacing:.2em;color:#5f7ba6;text-transform:uppercase;margin-bottom:3px}
.job.done{border-color:rgba(120,220,180,.35);box-shadow:0 0 18px rgba(90,220,170,.12)}
.dots::after{content:"…";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"…"}}

.feed{position:fixed;left:0;right:0;bottom:0;height:58px;display:flex;align-items:center;gap:0;padding:0 30px;background:linear-gradient(0deg,rgba(2,4,9,.92),transparent);overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.fitem{display:inline-flex;align-items:baseline;gap:9px;font-size:12px;color:#94a2ba;padding-right:26px;margin-right:26px;border-right:1px solid rgba(110,130,170,.14);opacity:0;animation:fUp .8s ease forwards}
.fitem .t{color:#4f5e7a;font-variant-numeric:tabular-nums;font-size:11px}
.fitem .d{color:#7fa8ff;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.fitem .d.g{color:#d8b26a}

.announce{position:fixed;left:50%;top:31%;transform:translateX(-50%);font-size:13.5px;letter-spacing:.06em;color:#bfe9ff;text-shadow:0 0 22px rgba(120,200,255,.5);opacity:0;transition:opacity .8s;pointer-events:none}
.announce.on{opacity:.95}
.tip{position:fixed;pointer-events:none;background:rgba(8,12,20,.85);border:1px solid rgba(120,150,220,.25);backdrop-filter:blur(6px);border-radius:8px;padding:7px 11px;font-size:11px;color:#c6d2e6;opacity:0;transition:opacity .18s;z-index:50}
.tip small{display:block;color:#5f7ba6;font-size:9px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:2px}
.note{position:fixed;bottom:64px;right:18px;font-size:9.5px;color:#333d54}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="glow" id="mglow"></div>
<div class="vg"></div>

<div class="room">
  <div class="brand">T I T A N</div>
  <div class="hud"><div>Brain <b>ACTIVE</b></div><div>Agents <b>3 WORKING</b></div><div>Sat 25 Jul</div></div>

  <nav class="rail" id="rail"></nav>

  <div class="tick" id="tick"></div>

  <div class="greet">
    <div class="who">Good afternoon, Robert</div>
    <div id="speech"></div>
    <div class="figures" id="figs">
      <div class="fig"><small>Data points analysed</small><b>12,418</b></div>
      <div class="fig"><small>Est. revenue today</small><b class="gold">£18,420</b></div>
      <div class="fig"><small>Confidence</small><b>96%</b></div>
    </div>
    <div class="handled" id="handled">Everything else is already handled.</div>
  </div>

  <div class="announce" id="announce"></div>
  <div class="feed" id="feed"></div>
  <div class="tip" id="tip"></div>
  <div class="note">prototype v2 · the feeling — shipped figures are measured, never invented</div>
</div>

<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const DPR=Math.min(devicePixelRatio,2);
let W,H,CX,CY,R;
function size(){W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;
cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
CX=W/2;CY=H*.385;R=Math.min(W,H)*.14}
size();addEventListener('resize',size);

let MX=innerWidth/2,MY=innerHeight/2;
const mglow=document.getElementById('mglow');
addEventListener('mousemove',e=>{MX=e.clientX;MY=e.clientY;
mglow.style.left=MX+'px';mglow.style.top=MY+'px';
document.body.classList.toggle('rail-on',e.clientX<170?true:(e.clientX>300?false:document.body.classList.contains('rail-on')));
});

/* ============ THE BRAIN — morphing particle organism ============ */
const N=850, P=[];
function fib(i,n){const g=Math.PI*(3-Math.sqrt(5));const y=1-(i/(n-1))*2;const r=Math.sqrt(1-y*y);const t=g*i;return[Math.cos(t)*r,y,Math.sin(t)*r]}
const SHAPES={
 sphere:i=>fib(i,N),
 brain:i=>{let[x,y,z]=fib(i,N);const s=x<0?-1:1;x=x*.72+s*.34; y*=.82; z*=1.05;
   const w=Math.sin(y*9+z*7)*.05;return[x+w,y+Math.sin(x*8)*.05,z+w]},
 neural:(i)=>{const c=i%14;const cc=fib(c*61%N,N);const j=fib(i,N);
   return[cc[0]*.75+j[0]*.3,cc[1]*.75+j[1]*.3,cc[2]*.75+j[2]*.3]},
 energy:i=>{const a=(i/N)*Math.PI*14;const r2=.55+.4*Math.sin(i*.7);
   return[Math.cos(a)*r2,((i/N)-.5)*1.5*Math.sin(a*.33),Math.sin(a)*r2]}
};
const ORDER=['sphere','neural','brain','energy'];
for(let i=0;i<N;i++){const s=SHAPES.sphere(i);P.push({x:s[0],y:s[1],z:s[2],tx:s[0],ty:s[1],tz:s[2],ph:Math.random()*7})}
let shapeIx=0;
function retarget(){shapeIx=(shapeIx+1)%ORDER.length;const f=SHAPES[ORDER[shapeIx]];
for(let i=0;i<N;i++){const t=f(i);P[i].tx=t[0];P[i].ty=t[1];P[i].tz=t[2]}}
setInterval(()=>{if(!document.hidden)retarget()},8500);

/* ============ meaningful stars ============ */
const STARTYPES=[["Customer","Bright Smile Dental"],["Customer","Crowns Dentists"],["Customer","Voltway Renewables"],["Pilot","Liberty Contractors"],["Campaign","Roofing · Search"],["Campaign","Driveways · Search"],["Keyword","roof repair oxford"],["Keyword","resin driveway surrey"],["Review","★★★★★ attested"],["Agent","SEO AI"],["Agent","Experience AI"],["Website","7 pages · live preview"],["Revenue","measured, first-party"],["Competitor","watching 3 rivals"],["Enquiry","answered · 14 min"],["Weather","Oxford 21°C clear"]];
const stars=[...Array(64)].map((_,i)=>{const meta=STARTYPES[i%STARTYPES.length];
return{x:Math.random(),y:Math.random()*.86,r:Math.random()*1.4+.6,a:Math.random()*.4+.15,
 meta:i<STARTYPES.length*2?meta:null,ph:Math.random()*7,ox:0,oy:0}});

/* ============ department constellations ============ */
const DEPTS=[
 {n:"Marketing",e:"🌍",x:.16,y:.20},{n:"Sales",e:"💰",x:.85,y:.22},
 {n:"Experience",e:"🎬",x:.88,y:.55},{n:"SEO",e:"📈",x:.13,y:.55},
 {n:"Reception",e:"📞",x:.20,y:.82},{n:"Intelligence",e:"📊",x:.82,y:.82}
];
DEPTS.forEach(d=>{d.glow=0;d.pts=[...Array(5)].map(()=>({dx:(Math.random()-.5)*.075,dy:(Math.random()-.5)*.075}))});
let collab=null;
setInterval(()=>{if(document.hidden)return;
 const a=Math.floor(Math.random()*DEPTS.length);let b=(a+1+Math.floor(Math.random()*(DEPTS.length-1)))%DEPTS.length;
 collab={a,b,t:0};},6200);

/* ============ packets: sources → brain, brain → departments ============ */
const SRC=["Website","Google","Meta","Calls","Email","Reviews","Finance","Weather"];
const inbound=[],outbound=[];
function spawnIn(fromEdge){const s=Math.random();let sx,sy;
 if(fromEdge===undefined)fromEdge=Math.floor(Math.random()*3);
 if(fromEdge===0){sx=-.02;sy=.15+s*.7}else if(fromEdge===1){sx=1.02;sy=.15+s*.7}else{sx=.1+s*.8;sy=-.02}
 inbound.push({sx,sy,t:0,sp:.004+Math.random()*.004,label:Math.random()<.22?SRC[Math.floor(Math.random()*SRC.length)]:null,c:(Math.random()-.5)});}
for(let i=0;i<10;i++){spawnIn();inbound[i].t=Math.random()}
setInterval(()=>{if(!document.hidden&&inbound.length<16)spawnIn()},700);
function spawnOut(di){outbound.push({d:DEPTS[di===undefined?Math.floor(Math.random()*DEPTS.length):di],t:0,sp:.008})}
setInterval(()=>{if(!document.hidden)spawnOut()},3400);

/* ============ THE CHOREOGRAPHY: a lead arrives ============ */
let chorus=null;
function newLead(){if(chorus)return;chorus={phase:0,t:0};}
setTimeout(newLead,16000);setInterval(()=>{if(!document.hidden)newLead()},42000);
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='n')newLead()});
const announce=document.getElementById('announce');

/* ============ render ============ */
let time=0,brainFlare=0;
function px(nx,ny,par){ // normalized→pixels with parallax
 const dx=(MX/innerWidth-.5)*par*40*DPR, dy=(MY/innerHeight-.5)*par*26*DPR;
 return[nx*W+dx,ny*H+dy]}
function frame(){
 time+=1/60; cx.clearRect(0,0,W,H);
 const breathe=1+Math.sin(time*1.05)*.05;
 const rot=time*.22;

 /* --- stars (meaningful) --- */
 let hover=null;
 for(const s of stars){
   const[sx0,sy0]=px(s.x,s.y,.5);
   const mdx=sx0/DPR-MX,mdy=sy0/DPR-MY,md=Math.hypot(mdx,mdy);
   const rep=md<110?(110-md)/110*10:0;
   s.ox+= (mdx/(md+1)*rep - s.ox)*.08; s.oy+=(mdy/(md+1)*rep - s.oy)*.08;
   const sx=sx0+s.ox*DPR, sy=sy0+s.oy*DPR;
   const tw=.65+.35*Math.sin(time*1.6+s.ph);
   cx.globalAlpha=s.a*tw*(s.meta?1.5:1);
   cx.fillStyle=s.meta?"#9fc0f5":"#6d84ad";
   cx.beginPath();cx.arc(sx,sy,s.r*DPR*(s.meta?1.3:1),0,7);cx.fill();
   if(s.meta&&md<13)hover={s,X:sx/DPR,Y:sy/DPR};
 }
 const tip=document.getElementById('tip');
 if(hover){tip.style.opacity=1;tip.style.left=(hover.X+14)+'px';tip.style.top=(hover.Y-8)+'px';
   tip.innerHTML=`<small>${hover.s.meta[0]}</small>${hover.s.meta[1]}`}
 else tip.style.opacity=0;

 /* --- constellations --- */
 for(const d of DEPTS){
   const[dx,dy]=px(d.x,d.y,.9); d.glow*= .955;
   for(const p of d.pts){
     const[qx,qy]=px(d.x+p.dx,d.y+p.dy,.9);
     cx.globalAlpha=.5+d.glow*.5;cx.fillStyle=d.glow>.1?"#bfe0ff":"#5f7ba6";
     cx.beginPath();cx.arc(qx,qy,1.5*DPR,0,7);cx.fill();
     cx.globalAlpha=.10+d.glow*.4;cx.strokeStyle="#6f8fc4";cx.lineWidth=.6*DPR;
     cx.beginPath();cx.moveTo(dx,dy);cx.lineTo(qx,qy);cx.stroke();
   }
   cx.globalAlpha=.5+d.glow;cx.fillStyle=d.glow>.1?"#dceeff":"#8aa3c8";
   cx.font=`${10*DPR}px -apple-system,Inter,sans-serif`;cx.textAlign="center";
   cx.fillText(`${d.e} ${d.n}`,dx,dy+26*DPR);cx.textAlign="left";
   if(d.glow>.4){cx.globalAlpha=d.glow*.25;
     const g2=cx.createRadialGradient(dx,dy,0,dx,dy,50*DPR);
     g2.addColorStop(0,"rgba(140,190,255,.5)");g2.addColorStop(1,"transparent");
     cx.fillStyle=g2;cx.beginPath();cx.arc(dx,dy,50*DPR,0,7);cx.fill();}
 }
 /* collaboration line */
 if(collab){collab.t+=.02;const A=DEPTS[collab.a],B=DEPTS[collab.b];
   const[ax,ay]=px(A.x,A.y,.9),[bx,by]=px(B.x,B.y,.9);
   const e=Math.min(1,collab.t);const fade=collab.t>1?Math.max(0,1-(collab.t-1)*1.4):1;
   cx.globalAlpha=.45*fade;cx.strokeStyle="#79e6ea";cx.lineWidth=.9*DPR;
   cx.setLineDash([4*DPR,7*DPR]);cx.lineDashOffset=-time*60*DPR;
   cx.beginPath();cx.moveTo(ax,ay);cx.lineTo(ax+(bx-ax)*e,ay+(by-ay)*e);cx.stroke();cx.setLineDash([]);
   if(collab.t>=1&&fade>0){A.glow=Math.max(A.glow,.4);B.glow=Math.max(B.glow,.6)}
   if(fade<=0)collab=null;}

 /* --- inbound packets --- */
 for(let i=inbound.length-1;i>=0;i--){const p=inbound[i];p.t+=p.sp;
   if(p.t>=1){inbound.splice(i,1);brainFlare=Math.min(1,brainFlare+.08);continue}
   const e=1-Math.pow(1-p.t,2);
   const[sx,sy]=px(p.sx,p.sy,.2);
   const mx=(sx+CX)/2+(sy-CY)*p.c*.4, my=(sy+CY)/2-(sx-CX)*p.c*.4;
   const x=(1-e)*(1-e)*sx+2*(1-e)*e*mx+e*e*CX, y=(1-e)*(1-e)*sy+2*(1-e)*e*my+e*e*CY;
   cx.globalAlpha=Math.min(1,p.t*4)*.85;cx.fillStyle="#79e6ea";
   cx.beginPath();cx.arc(x,y,1.5*DPR,0,7);cx.fill();
   cx.globalAlpha*=.3;cx.beginPath();cx.arc(x,y,3.6*DPR,0,7);cx.fill();
   if(p.label&&p.t<.4){cx.globalAlpha=.5*(1-p.t*2.2);cx.fillStyle="#7d93b8";
     cx.font=`${10*DPR}px -apple-system,Inter,sans-serif`;cx.fillText(p.label,x+7*DPR,y+3*DPR)}}

 /* --- outbound packets --- */
 for(let i=outbound.length-1;i>=0;i--){const p=outbound[i];p.t+=p.sp;
   const[dx,dy]=px(p.d.x,p.d.y,.9);
   if(p.t>=1){p.d.glow=Math.min(1,p.d.glow+.7);outbound.splice(i,1);continue}
   const x=CX+(dx-CX)*p.t, y=CY+(dy-CY)*p.t;
   cx.globalAlpha=.9*(1-p.t*.3);cx.fillStyle="#9db9ff";
   cx.beginPath();cx.arc(x,y,1.8*DPR,0,7);cx.fill();
   cx.globalAlpha=.2;cx.strokeStyle="#9db9ff";cx.lineWidth=.6*DPR;
   cx.beginPath();cx.moveTo(CX+(dx-CX)*Math.max(0,p.t-.08),CY+(dy-CY)*Math.max(0,p.t-.08));cx.lineTo(x,y);cx.stroke();}

 /* --- choreography --- */
 if(chorus){chorus.t+=1/60;
  if(chorus.phase===0){ // pulse races in from right edge
    const e=Math.min(1,chorus.t/1.1);const x=W*1.02+(CX-W*1.02)*e,y=H*.3+(CY-H*.3)*e;
    cx.globalAlpha=.95;cx.fillStyle="#ffe9b0";cx.beginPath();cx.arc(x,y,2.6*DPR,0,7);cx.fill();
    const g3=cx.createRadialGradient(x,y,0,x,y,26*DPR);g3.addColorStop(0,"rgba(255,225,150,.5)");g3.addColorStop(1,"transparent");
    cx.fillStyle=g3;cx.beginPath();cx.arc(x,y,26*DPR,0,7);cx.fill();
    if(e>=1){chorus.phase=1;chorus.t=0;brainFlare=1.6}}
  else if(chorus.phase===1){ // the Brain thinks
    if(chorus.t>1.9){chorus.phase=2;chorus.t=0;
      spawnOut(0);spawnOut(1);spawnOut(4); // Marketing, Sales, Reception
      announce.textContent="New enquiry received. Strategy delegated.";announce.classList.add('on')}}
  else if(chorus.phase===2){ if(chorus.t>3.4){announce.classList.remove('on');chorus=null}}}

 /* --- THE BRAIN --- */
 brainFlare*=.965;
 const rr=R*breathe*(1+brainFlare*.12);
 let g=cx.createRadialGradient(CX,CY,0,CX,CY,rr*3.4);
 g.addColorStop(0,`rgba(120,170,255,${.13+brainFlare*.12})`);g.addColorStop(.55,"rgba(90,140,240,.04)");g.addColorStop(1,"transparent");
 cx.fillStyle=g;cx.beginPath();cx.arc(CX,CY,rr*3.4,0,7);cx.fill();
 // particles
 const mrot=((MX/innerWidth)-.5)*.35;
 for(const p of P){
   p.x+=(p.tx-p.x)*.028;p.y+=(p.ty-p.y)*.028;p.z+=(p.tz-p.z)*.028;
   const a=rot+mrot, ca=Math.cos(a),sa=Math.sin(a);
   const x3=p.x*ca-p.z*sa, z3=p.x*sa+p.z*ca;
   const depth=(z3+1.6)/2.6;
   const jitter=Math.sin(time*2+p.ph)*.008;
   const X=CX+(x3+jitter)*rr*1.35, Y=CY+(p.y+jitter)*rr*1.15;
   cx.globalAlpha=(.12+depth*.55)*(1+brainFlare*.5);
   cx.fillStyle=depth>.72?"#e6f0ff":"#8fb0e8";
   cx.beginPath();cx.arc(X,Y,(.6+depth*1.1)*DPR,0,7);cx.fill();
 }
 // core
 cx.globalAlpha=.45+.3*Math.sin(time*1.8)+brainFlare*.4;
 g=cx.createRadialGradient(CX,CY,0,CX,CY,rr*.4);
 g.addColorStop(0,"rgba(255,255,255,.85)");g.addColorStop(1,"transparent");
 cx.fillStyle=g;cx.beginPath();cx.arc(CX,CY,rr*.4,0,7);cx.fill();
 cx.globalAlpha=1;

 requestAnimationFrame(frame);
}
frame();

/* ============ rail ============ */
const RAIL=[["🧠","Brain"],["🌍","Marketing"],["💰","Sales"],["🎬","Experience"],["📞","Reception"],["📈","Growth"],["⚙️","Automation"],["📊","Intelligence"],["🛠","Operations"],["👥","Customers"]];
document.getElementById('rail').innerHTML=RAIL.map(r=>`<div class="dept-l"><span>${r[0]}</span>${r[1]}</div>`).join('');

/* ============ the Brain speaks ============ */
const LINES=["I analysed <b>12,418 data points</b> overnight. ","Three departments are working. ","<b>One strategic decision</b> needs your approval."];
const speech=document.getElementById('speech');let li=0,ci=0,buf="";
function type(){
 if(li>=LINES.length){document.getElementById('figs').classList.add('show');
   setTimeout(()=>document.getElementById('handled').classList.add('show'),700);return}
 const t=LINES[li];
 if(ci<t.length){ if(t[ci]==='<'){const c=t.indexOf('>',ci);buf+=t.slice(ci,c+1);ci=c+1}
   else{buf+=t[ci];ci++}
   speech.innerHTML=buf+"<span class='caret'></span>";setTimeout(type,17+Math.random()*22)}
 else{li++;ci=0;buf+=li<LINES.length?"<br>":"";setTimeout(type,420)}}
setTimeout(type,3000);

/* ============ AI activity ticker ============ */
const JOBS=[["Marketing AI","Balancing budget across 4 campaigns"],["SEO AI","Writing 18 area pages"],["Experience AI","Rendering hero animations"],["Reception AI","Transcribing this morning's calls"],["Intelligence AI","Scoring 3 competitor moves"],["Sales AI","Preparing follow-up for Crowns"]];
const tick=document.getElementById('tick');let ji=0;
function pushJob(){
 const j=JOBS[ji++%JOBS.length];
 const el=document.createElement('div');el.className='job';
 el.innerHTML=`<small>${j[0]}</small><span class="dots">${j[1]}</span>`;
 tick.appendChild(el);requestAnimationFrame(()=>el.classList.add('on'));
